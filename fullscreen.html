      // behind by earlier deploys stay active forever and keep serving their own
      // cached HTML - a returning visitor would land on the old editor page at
      // "/" and get bounced to /editor.html. Evict them, refresh the cached root
      // document, and reload once so this visitor lands on the current build.
      (function () {
        var BUST_KEY = 'tw:service-worker-purge';
        function dropCaches() {
          if (!window.caches || !caches.keys) return;
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              caches.delete(name);
            });
          }).catch(function () {});
        }
        // GitHub Pages serves HTML with max-age=600, so the browser's HTTP cache
        // still holds the previous deploy's root document. Replace that entry.
        function refreshRoot() {
          if (!window.fetch) return Promise.resolve();
          return fetch(location.pathname, {
            cache: 'reload',
            credentials: 'same-origin'
          }).catch(function () {});
        }
        function reload() {
          // A URL that already carries nocache= is guaranteed fresh; reloading it
          // would just add another parameter.
          if (/[?&]nocache=[\d.]+/.test(location.search)) return;
          try {
            if (sessionStorage.getItem(BUST_KEY)) return;
            sessionStorage.setItem(BUST_KEY, '1');
          } catch (e) {
            // No sessionStorage: skip the reload rather than risk a loop.
            return;
          }
          var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
          location.replace(location.pathname + search + (search ? '&' : '?') +
            'nocache=' + Math.floor(Math.random() * 10000000));
        }
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          if (!registrations.length) return false;
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            return true;
          });
        }).then(function (purged) {
          if (!purged) return;
          dropCaches();
          refreshRoot().then(reload);
        }).catch(function () {});
      })();</script><noscript><div class="splash-screen"><div><h1>PineWarp requires JavaScript</h1><p>Consider using <a href="https://desktop.turbowarp.org/">TurboWarp Desktop</a> if you are afraid of remote JavaScript.</p></div></div></noscript><div class="splash-screen spash-waiting-for-js" hidden><div class="splash-spinner"></div><div class="splash-error-title" hidden>Something went wrong. <a href="https://github.com/PineWarp/scratch-gui/issues" target="_blank" rel="noreferrer">Please report</a> with the information below.</div><div class="splash-errors" hidden></div><button class="splash-reset" hidden>with the information below.</button></div><div class="splash-errors" hidden></div><button class="splash-reset" hidden>Click here to reset caches (can fix some errors)</button><script>(function () {
        'use strict';

        var theme = '';
        var accent = '#75C1C4';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            theme = parsed.gui || 'light';
            accent = parsed.accent || accent;
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        splash.style.color = accent;
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();</script><div id="app"></div></body></html>
