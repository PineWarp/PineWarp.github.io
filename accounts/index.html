<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PineWarp Accounts · 登录 / 注册</title>
<meta name="description" content="PineWarp Accounts — 登录或注册你的 PineWarp 账号。">
<link rel="icon" href="/favicon.ico">
<style>
    :root {
        --bg-0: #0f1418;
        --bg-1: #161d23;
        --bg-2: #1d262e;
        --line: #2b3742;
        --fg: #e6edf3;
        --fg-dim: #93a4b3;
        --brand: #5da8cc;
        --brand-2: #75c1c4;
        --danger: #e06c75;
        --ok: #7dd3a8;
        --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        margin: 0;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background:
            radial-gradient(1200px 600px at 15% -10%, #1c3a46 0%, transparent 60%),
            radial-gradient(900px 500px at 110% 110%, #17343a 0%, transparent 55%),
            var(--bg-0);
        color: var(--fg);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    .shell {
        width: 100%;
        max-width: 420px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
    }

    .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(160deg, var(--brand), var(--brand-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 6px 18px rgba(93, 168, 204, .35);
    }

    .brand-text b { display: block; font-size: 16px; letter-spacing: .2px; }
    .brand-text span { display: block; font-size: 12px; color: var(--fg-dim); }

    .card {
        background: var(--bg-1);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }

    .tabs {
        display: flex;
        gap: 6px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 4px;
        margin-bottom: 20px;
    }

    .tab {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--fg-dim);
        font: inherit;
        font-size: 14px;
        padding: 9px 0;
        border-radius: 8px;
        cursor: pointer;
        transition: background .15s, color .15s;
    }

    .tab[aria-selected="true"] {
        background: linear-gradient(160deg, var(--brand), var(--brand-2));
        color: #0d1b21;
        font-weight: 600;
    }

    .field { margin-bottom: 14px; }

    .field label {
        display: block;
        font-size: 13px;
        color: var(--fg-dim);
        margin-bottom: 6px;
    }

    .field input {
        width: 100%;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--fg);
        font: inherit;
        padding: 11px 13px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    .field input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(93, 168, 204, .18);
    }

    .field input::placeholder { color: #5d6c79; }

    .hint { font-size: 12px; color: var(--fg-dim); margin-top: 6px; }

    .submit {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 0;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #0d1b21;
        background: linear-gradient(160deg, var(--brand), var(--brand-2));
        cursor: pointer;
        margin-top: 6px;
        transition: filter .15s, opacity .15s;
    }

    .submit:hover:not(:disabled) { filter: brightness(1.08); }
    .submit:disabled { opacity: .55; cursor: default; }

    .message {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
    }

    .message.show { display: block; }
    .message.error { background: rgba(224, 108, 117, .12); border: 1px solid rgba(224, 108, 117, .45); color: #ffb3b3; }
    .message.ok { background: rgba(125, 211, 168, .12); border: 1px solid rgba(125, 211, 168, .45); color: #b6f0d2; }

    .foot {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: var(--fg-dim);
        flex-wrap: wrap;
    }

    .foot a { color: var(--brand-2); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    .account-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
    }

    .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: linear-gradient(160deg, var(--brand), var(--brand-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        color: #0d1b21;
        text-transform: uppercase;
    }

    .account-name { font-size: 16px; font-weight: 600; }
    .account-meta { font-size: 12px; color: var(--fg-dim); }

    .ghost {
        width: 100%;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 10px;
        padding: 11px 0;
        font: inherit;
        cursor: pointer;
    }

    .ghost:hover { background: var(--bg-2); }

    [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
    <div class="brand">
        <div class="brand-mark">🍍</div>
        <div class="brand-text">
            <b>PineWarp Accounts</b>
            <span>一个账号，通行社区与编辑器</span>
        </div>
    </div>

    <div class="card">
        <!-- 已登录 -->
        <section id="view-account" hidden>
            <div class="account-row">
                <div class="avatar" id="account-initial">P</div>
                <div>
                    <div class="account-name" id="account-name">—</div>
                    <div class="account-meta" id="account-meta">—</div>
                </div>
            </div>
            <button class="ghost" id="btn-logout" type="button">退出登录</button>
        </section>

        <!-- 登录 / 注册 -->
        <section id="view-auth">
            <div class="tabs" role="tablist">
                <button class="tab" id="tab-login" role="tab" aria-selected="true" type="button">登录</button>
                <button class="tab" id="tab-register" role="tab" aria-selected="false" type="button">注册</button>
            </div>

            <form id="form-login" autocomplete="on">
                <div class="field">
                    <label for="login-username">用户名</label>
                    <input id="login-username" name="username" type="text" autocomplete="username" placeholder="你的用户名" required>
                </div>
                <div class="field">
                    <label for="login-password">密码</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="你的密码" required>
                </div>
                <button class="submit" id="btn-login" type="submit">登录</button>
            </form>

            <form id="form-register" autocomplete="on" hidden>
                <div class="field">
                    <label for="register-username">用户名</label>
                    <input id="register-username" name="username" type="text" autocomplete="username" placeholder="3–20 位字母、数字、_ 或 -" required>
                    <div class="hint">用于显示与他人 @提及，注册后不可更改。</div>
                </div>
                <div class="field">
                    <label for="register-password">密码</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
                </div>
                <div class="field">
                    <label for="register-confirm">确认密码</label>
                    <input id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="再输入一次" required>
                </div>
                <button class="submit" id="btn-register" type="submit">创建账号</button>
            </form>

            <div class="message" id="message" role="status" aria-live="polite"></div>
        </section>

        <div class="foot">
            <a href="/">← 返回社区首页</a>
            <a href="/editor.html">打开编辑器</a>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var USERS_KEY = 'pinewarp:accounts:users';
    var SESSION_KEY = 'pinewarp:accounts:session';
    var LEGACY_TOKEN_KEY = 'mw:rotur-token';
    var PBKDF2_ITERATIONS = 150000;
    var USERNAME_RE = /^[A-Za-z0-9_-]{3,20}$/;

    var el = function (id) { return document.getElementById(id); };
    var messageEl = el('message');

    function setMessage (text, kind) {
        messageEl.textContent = text || '';
        messageEl.className = 'message' + (text ? ' show ' + (kind || '') : '');
    }

    function readUsers () {
        try {
            var raw = localStorage.getItem(USERS_KEY);
            var parsed = raw ? JSON.parse(raw) : null;
            return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (e) {
            return {};
        }
    }

    function writeUsers (users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function toHex (buffer) {
        var bytes = new Uint8Array(buffer);
        var out = '';
        for (var i = 0; i < bytes.length; i++) {
            out += bytes[i].toString(16).padStart(2, '0');
        }
        return out;
    }

    function randomHex (byteLength) {
        var bytes = new Uint8Array(byteLength);
        crypto.getRandomValues(bytes);
        return toHex(bytes.buffer);
    }

    function deriveHash (password, saltHex, iterations) {
        var salt = new Uint8Array(saltHex.match(/.{2}/g).map(function (pair) {
            return parseInt(pair, 16);
        }));
        return crypto.subtle
            .importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
            .then(function (key) {
                return crypto.subtle.deriveBits({
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-256'
                }, key, 256);
            })
            .then(toHex);
    }

    // 定长比较，避免用 === 比较哈希时泄漏时序信息
    function safeEqual (a, b) {
        if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
        var diff = 0;
        for (var i = 0; i < a.length; i++) {
            diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
        }
        return diff === 0;
    }

    function readSession () {
        try {
            var raw = localStorage.getItem(SESSION_KEY);
            var parsed = raw ? JSON.parse(raw) : null;
            if (!parsed || !parsed.username) return null;
            if (parsed.expiresAt && Date.now() > parsed.expiresAt) {
                clearSession();
                return null;
            }
            return parsed;
        } catch (e) {
            return null;
        }
    }

    function createSession (username) {
        var session = {
            username: username,
            token: 'pinewarp_' + randomHex(24),
            issuedAt: Date.now(),
            expiresAt: Date.now() + 30 * 24 * 60 * 60 * 1000
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        // 兼容编辑器/社区现有的读取方式
        localStorage.setItem(LEGACY_TOKEN_KEY, 'rotur_' + session.token);
        return session;
    }

    function clearSession () {
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(LEGACY_TOKEN_KEY);
    }

    function returnTo () {
        var value = new URLSearchParams(location.search).get('return_to');
        if (!value) return null;
        try {
            var url = new URL(value, location.origin);
            // 只允许跳回本站，避免开放重定向
            if (url.origin !== location.origin) return null;
            if (url.pathname.indexOf('/accounts') === 0) return null;
            return url.href;
        } catch (e) {
            return null;
        }
    }

    function renderAccount (session) {
        el('view-account').hidden = false;
        el('view-auth').hidden = true;
        el('account-name').textContent = session.username;
        el('account-initial').textContent = session.username.charAt(0);
        el('account-meta').textContent = '已于 ' + new Date(session.issuedAt).toLocaleString() + ' 登录';
    }

    function renderAuth () {
        el('view-account').hidden = true;
        el('view-auth').hidden = false;
    }

    function selectTab (name) {
        var isLogin = name === 'login';
        el('tab-login').setAttribute('aria-selected', String(isLogin));
        el('tab-register').setAttribute('aria-selected', String(!isLogin));
        el('form-login').hidden = !isLogin;
        el('form-register').hidden = isLogin;
        setMessage('');
    }

    function busy (button, isBusy, label) {
        button.disabled = isBusy;
        if (isBusy) {
            button.dataset.label = button.textContent;
            button.textContent = label;
        } else if (button.dataset.label) {
            button.textContent = button.dataset.label;
            delete button.dataset.label;
        }
    }

    el('tab-login').addEventListener('click', function () { selectTab('login'); });
    el('tab-register').addEventListener('click', function () { selectTab('register'); });

    el('form-login').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = el('btn-login');
        var username = el('login-username').value.trim();
        var password = el('login-password').value;
        if (!username || !password) return;

        var users = readUsers();
        var record = users[username.toLowerCase()];
        if (!record) {
            setMessage('该用户名尚未注册。', 'error');
            return;
        }

        busy(button, true, '登录中…');
        setMessage('');
        deriveHash(password, record.salt, record.iterations || PBKDF2_ITERATIONS)
            .then(function (hash) {
                if (!safeEqual(hash, record.hash)) {
                    throw new Error('用户名或密码不正确。');
                }
                var session = createSession(record.username);
                var target = returnTo();
                if (target) {
                    setMessage('登录成功，正在返回…', 'ok');
                    location.replace(target);
                    return;
                }
                renderAccount(session);
                setMessage('登录成功，欢迎回来，' + record.username + '！', 'ok');
            })
            .catch(function (error) {
                setMessage(error && error.message ? error.message : '登录失败，请重试。', 'error');
            })
            .then(function () {
                busy(button, false);
            });
    });

    el('form-register').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = el('btn-register');
        var username = el('register-username').value.trim();
        var password = el('register-password').value;
        var confirm = el('register-confirm').value;

        if (!USERNAME_RE.test(username)) {
            setMessage('用户名需为 3–20 位字母、数字、下划线或连字符。', 'error');
            return;
        }
        if (password.length < 8) {
            setMessage('密码至少需要 8 位。', 'error');
            return;
        }
        if (password !== confirm) {
            setMessage('两次输入的密码不一致。', 'error');
            return;
        }

        var users = readUsers();
        if (users[username.toLowerCase()]) {
            setMessage('该用户名已被注册，请换一个。', 'error');
            return;
        }

        busy(button, true, '创建中…');
        setMessage('');
        var salt = randomHex(16);
        deriveHash(password, salt, PBKDF2_ITERATIONS)
            .then(function (hash) {
                var latest = readUsers();
                if (latest[username.toLowerCase()]) {
                    throw new Error('该用户名已被注册，请换一个。');
                }
                latest[username.toLowerCase()] = {
                    username: username,
                    salt: salt,
                    hash: hash,
                    iterations: PBKDF2_ITERATIONS,
                    createdAt: Date.now()
                };
                writeUsers(latest);

                var session = createSession(username);
                var target = returnTo();
                if (target) {
                    setMessage('注册成功，正在返回…', 'ok');
                    location.replace(target);
                    return;
                }
                renderAccount(session);
                setMessage('注册成功，欢迎加入 PineWarp，' + username + '！', 'ok');
            })
            .catch(function (error) {
                setMessage(error && error.message ? error.message : '注册失败，请重试。', 'error');
            })
            .then(function () {
                busy(button, false);
            });
    });

    el('btn-logout').addEventListener('click', function () {
        clearSession();
        renderAuth();
        selectTab('login');
        setMessage('已退出登录。', 'ok');
    });

    if (!window.crypto || !window.crypto.subtle) {
        setMessage('当前浏览器不支持安全加密（WebCrypto），无法注册或登录。', 'error');
        el('btn-login').disabled = true;
        el('btn-register').disabled = true;
    }

    var existing = readSession();
    if (existing) {
        renderAccount(existing);
        var pending = returnTo();
        if (pending) location.replace(pending);
    } else {
        renderAuth();
    }
}());
</script>
</body>
</html>
