      }</style><script defer="defer" src="js/gleba20/runtime.4a801e35778f70e75da7.js"></script><script defer="defer" src="js/gleba20/paint.48fc6fd708013b155402.js"></script><script defer="defer" src="js/gleba20/scratch-vm.4ea862ff6617e0c38da2.js"></script><script defer="defer" src="js/gleba20/react.c076cd637d6d77f2e735.js"></script><script defer="defer" src="js/gleba20/scratch-render.5e5a859ff8a1d59405a7.js"></script><script defer="defer" src="js/gleba20/vendors.4b6848fc49ecef1aee2a.js"></script><script defer="defer" src="js/gleba20/common.e01f8379082cfe624a14.js"></script><script defer="defer" src="js/gleba20/embed.db1b26b7d7e42bc536a0.js"></script></head><body><script>// This build does not register a service worker, but registrations left
      // behind by earlier deploys stay active forever and keep serving their own
      // cached HTML - a returning visitor would land on the old editor page at
      // "/" and get bounced to /editor.html. Evict them, refresh the cached root
      // document, and reload once so this visitor lands on the current build.
      (function () {
        var BUST_KEY = 'tw:service-worker-purge';
        function dropCaches() {
          if (!window.caches || !caches.keys) return;
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              caches.delete(name);
            });
          }).catch(function () {});
        }
        // GitHub Pages serves HTML with max-age=600, so the browser's HTTP cache
        // still holds the previous deploy's root document. Replace that entry.
        function refreshRoot() {
          if (!window.fetch) return Promise.resolve();
          return fetch(location.pathname, {
            cache: 'reload',
            credentials: 'same-origin'
          }).catch(function () {});
        }
        function reload() {
          // A URL that already carries nocache= is guaranteed fresh; reloading it
          // would just add another parameter.
          if (/[?&]nocache=[\d.]+/.test(location.search)) return;
          try {
            if (sessionStorage.getItem(BUST_KEY)) return;
            sessionStorage.setItem(BUST_KEY, '1');
          } catch (e) {
            // No sessionStorage: skip the reload rather than risk a loop.
            return;
          }
          var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
          location.replace(location.pathname + search + (search ? '&' : '?') +
            'nocache=' + Math.floor(Math.random() * 10000000));
        }
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          if (!registrations.length) return false;
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            return true;
          });
        }).then(function (purged) {
          if (!purged) return;
          dropCaches();
          refreshRoot().then(reload);
        }).catch(function () {});
      })();</script><noscript><div class="splash-screen"><h1>This embed requires JavaScript</h1></div></noscript><div class="splash-screen" hidden id="splash-need-js"><div class="splash-spinner"></div></div><script>(function() {

        var splash = document.getElementById('splash-need-js');
